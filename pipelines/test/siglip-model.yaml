name: siglip-model

needs:
  packages:
    - build-base
    - go-1.27
    - openvino-dev
    - pkgconf

inputs:
  model-dir:
    description: Installed SigLIP model directory (format 1) to load.
    required: true

pipeline:
  - name: Go cgo smoke test of the SigLIP model
    runs: |
      set -eu
      work=$(mktemp -d)
      export GOTOOLCHAIN=local GOFLAGS= GOCACHE="$work/cache" GOPATH="$work/gopath"
      mkdir "$work/src"
      cd "$work/src"
      cat > go.mod <<'GOEOF'
      module siglip-smoke

      go 1.27
      GOEOF
      cat > main.go <<'GOEOF'
      // Command siglip-smoke loads a SigLIP model (format 1) through the OpenVINO C API and
      // checks that the tokenizer IR, text.xml and vision.xml reproduce reference.json.
      package main

      /*
      #cgo pkg-config: openvino-c
      #include <stdlib.h>
      #include <openvino/c/openvino.h>

      static ov_status_e compile_cpu(ov_core_t *core, const ov_model_t *model, ov_compiled_model_t **out) {
      	return ov_core_compile_model(core, model, "CPU", 0, out);
      }
      */
      import "C"

      import (
      	"encoding/json"
      	"flag"
      	"fmt"
      	"math"
      	"os"
      	"path/filepath"
      	"slices"
      	"unsafe"
      )

      const minCosine = 0.99

      type meta struct {
      	Format        int       `json:"format"`
      	Weights       string    `json:"weights"`
      	EmbeddingSize int64     `json:"embedding_size"`
      	ImageSize     int64     `json:"image_size"`
      	MaxTextLength int64     `json:"max_text_length"`
      	RescaleFactor float64   `json:"rescale_factor"`
      	ImageMean     []float64 `json:"image_mean"`
      	ImageStd      []float64 `json:"image_std"`
      	LogitScale    float64   `json:"logit_scale"`
      	LogitBias     float64   `json:"logit_bias"`
      }

      type reference struct {
      	Images []struct {
      		A      int64     `json:"a"`
      		B      int64     `json:"b"`
      		Embeds []float32 `json:"embeds"`
      	} `json:"images"`
      	Texts []struct {
      		Prompt   string    `json:"prompt"`
      		InputIDs []int64   `json:"input_ids"`
      		Embeds   []float32 `json:"embeds"`
      	} `json:"texts"`
      }

      func check(what string, st C.ov_status_e) {
      	if st != C.OK {
      		fmt.Fprintf(os.Stderr, "%s: %s\n", what, C.GoString(C.ov_get_last_err_msg()))
      		os.Exit(1)
      	}
      }

      func fail(format string, args ...any) {
      	fmt.Fprintf(os.Stderr, format+"\n", args...)
      	os.Exit(1)
      }

      func shapeOf(dims []int64) C.ov_shape_t {
      	var s C.ov_shape_t
      	check("ov_shape_create", C.ov_shape_create(C.int64_t(len(dims)), (*C.int64_t)(unsafe.Pointer(&dims[0])), &s))
      	return s
      }

      // newTensor copies data into a tensor that OpenVINO owns.
      func newTensor[T int64 | float32](et C.ov_element_type_e, dims []int64, data []T) *C.ov_tensor_t {
      	s := shapeOf(dims)
      	defer C.ov_shape_free(&s)
      	var t *C.ov_tensor_t
      	check("ov_tensor_create", C.ov_tensor_create(et, s, &t))
      	var p unsafe.Pointer
      	check("ov_tensor_data", C.ov_tensor_data(t, &p))
      	copy(unsafe.Slice((*T)(p), len(data)), data)
      	return t
      }

      func tensorDims(t *C.ov_tensor_t) []int64 {
      	var s C.ov_shape_t
      	check("ov_tensor_get_shape", C.ov_tensor_get_shape(t, &s))
      	defer C.ov_shape_free(&s)
      	return slices.Clone(unsafe.Slice((*int64)(unsafe.Pointer(s.dims)), int(s.rank)))
      }

      func tensorData[T int64 | float32](t *C.ov_tensor_t) []T {
      	var n C.size_t
      	check("ov_tensor_get_size", C.ov_tensor_get_size(t, &n))
      	var p unsafe.Pointer
      	check("ov_tensor_data", C.ov_tensor_data(t, &p))
      	return slices.Clone(unsafe.Slice((*T)(p), int(n)))
      }

      // request compiles path for the CPU and returns an inference request on it.
      func request(core *C.ov_core_t, path string) *C.ov_infer_request_t {
      	cpath := C.CString(path)
      	defer C.free(unsafe.Pointer(cpath))
      	var model *C.ov_model_t
      	check("read "+path, C.ov_core_read_model(core, cpath, nil, &model))
      	defer C.ov_model_free(model)
      	var cm *C.ov_compiled_model_t
      	check("compile "+path, C.compile_cpu(core, model, &cm))
      	defer C.ov_compiled_model_free(cm)
      	var req *C.ov_infer_request_t
      	check("request "+path, C.ov_compiled_model_create_infer_request(cm, &req))
      	return req
      }

      // run feeds in to the request's input named in and returns its output named out.
      func run(req *C.ov_infer_request_t, in string, t *C.ov_tensor_t, out string) *C.ov_tensor_t {
      	cin, cout := C.CString(in), C.CString(out)
      	defer C.free(unsafe.Pointer(cin))
      	defer C.free(unsafe.Pointer(cout))
      	check("set "+in, C.ov_infer_request_set_tensor(req, cin, t))
      	check("infer", C.ov_infer_request_infer(req))
      	var res *C.ov_tensor_t
      	check("get "+out, C.ov_infer_request_get_tensor(req, cout, &res))
      	return res
      }

      // tokenize maps prompts to input_ids rows of max_text_length ids each.
      func tokenize(req *C.ov_infer_request_t, prompts []string) [][]int64 {
      	n := len(prompts)
      	strs := unsafe.Slice((**C.char)(C.malloc(C.size_t(n)*C.size_t(unsafe.Sizeof(uintptr(0))))), n)
      	defer C.free(unsafe.Pointer(&strs[0]))
      	for i, p := range prompts {
      		strs[i] = C.CString(p)
      		defer C.free(unsafe.Pointer(strs[i]))
      	}
      	s := shapeOf([]int64{int64(n)})
      	defer C.ov_shape_free(&s)
      	var in *C.ov_tensor_t
      	check("string tensor", C.ov_tensor_create_from_string_array(&strs[0], C.size_t(n), s, &in))
      	defer C.ov_tensor_free(in)
      	check("tokenizer input", C.ov_infer_request_set_input_tensor_by_index(req, 0, in))
      	check("tokenizer infer", C.ov_infer_request_infer(req))
      	cname := C.CString("input_ids")
      	defer C.free(unsafe.Pointer(cname))
      	var out *C.ov_tensor_t
      	check("tokenizer output", C.ov_infer_request_get_tensor(req, cname, &out))
      	defer C.ov_tensor_free(out)
      	dims, ids := tensorDims(out), tensorData[int64](out)
      	return slices.Collect(slices.Chunk(ids, int(dims[1])))
      }

      // pixels is reference image (a, b) as a normalised [1,3,S,S] input, see siglip_export.py.
      func pixels(m meta, a, b int64) []float32 {
      	s := m.ImageSize
      	px := make([]float32, 0, 3*s*s)
      	for c := range int64(3) {
      		for y := range s {
      			for x := range s {
      				v := (a*x + b*y + 85*c + 128*((x/16+y/16)%2)) % 256
      				px = append(px, float32((float64(v)*m.RescaleFactor-m.ImageMean[c])/m.ImageStd[c]))
      			}
      		}
      	}
      	return px
      }

      // embed runs one input row through a tower and checks the [1,E] output.
      func embed[T int64 | float32](req *C.ov_infer_request_t, m meta, et C.ov_element_type_e, in string, dims []int64,
      	data []T, out string) []float32 {
      	t := newTensor(et, dims, data)
      	defer C.ov_tensor_free(t)
      	res := run(req, in, t, out)
      	defer C.ov_tensor_free(res)
      	if d := tensorDims(res); !slices.Equal(d, []int64{1, m.EmbeddingSize}) {
      		fail("%s shape %v, want [1 %d]", out, d, m.EmbeddingSize)
      	}
      	return tensorData[float32](res)
      }

      func cosine(a, b []float32) float64 {
      	var ab, aa, bb float64
      	for i := range a {
      		ab += float64(a[i]) * float64(b[i])
      		aa += float64(a[i]) * float64(a[i])
      		bb += float64(b[i]) * float64(b[i])
      	}
      	return ab / math.Sqrt(aa*bb)
      }

      func readJSON(path string, v any) {
      	raw, err := os.ReadFile(path)
      	if err != nil {
      		fail("%v", err)
      	}
      	if err := json.Unmarshal(raw, v); err != nil {
      		fail("%s: %v", path, err)
      	}
      }

      func main() {
      	tokenizers := flag.String("tokenizers", "/usr/lib/libopenvino_tokenizers.so", "openvino-tokenizers extension")
      	flag.Parse()
      	if flag.NArg() != 1 {
      		fail("usage: siglip-smoke [-tokenizers lib] <model-dir>")
      	}
      	dir := flag.Arg(0)
      	var m meta
      	readJSON(filepath.Join(dir, "siglip.json"), &m)
      	if m.Format != 1 || m.EmbeddingSize == 0 || m.ImageSize == 0 || len(m.ImageMean) != 3 || len(m.ImageStd) != 3 {
      		fail("siglip.json: unsupported %+v", m)
      	}
      	var ref reference
      	readJSON(filepath.Join(dir, "reference.json"), &ref)
      	if len(ref.Images) == 0 || len(ref.Texts) == 0 {
      		fail("reference.json: %d images, %d texts", len(ref.Images), len(ref.Texts))
      	}

      	var core *C.ov_core_t
      	check("ov_core_create", C.ov_core_create(&core))
      	defer C.ov_core_free(core)
      	ext := C.CString(*tokenizers)
      	defer C.free(unsafe.Pointer(ext))
      	check("add tokenizers extension", C.ov_core_add_extension(core, ext))

      	tok := request(core, filepath.Join(dir, "openvino_tokenizer.xml"))
      	defer C.ov_infer_request_free(tok)
      	var prompts []string
      	for _, t := range ref.Texts {
      		prompts = append(prompts, t.Prompt)
      	}
      	ids := tokenize(tok, prompts)
      	for i, t := range ref.Texts {
      		if !slices.Equal(ids[i], t.InputIDs) {
      			fail("tokenizer: %q -> %v, want %v", t.Prompt, ids[i], t.InputIDs)
      		}
      	}
      	fmt.Printf("tokenizer: %d prompts match\n", len(ids))

      	worst := 1.0
      	accept := func(what string, got, want []float32) []float32 {
      		c := cosine(got, want)
      		fmt.Printf("%s: cosine %.6f\n", what, c)
      		if !(c >= minCosine) {
      			fail("%s: cosine %.6f < %.2f", what, c, minCosine)
      		}
      		worst = min(worst, c)
      		return got
      	}

      	text := request(core, filepath.Join(dir, "text.xml"))
      	defer C.ov_infer_request_free(text)
      	var texts [][]float32
      	for i, t := range ref.Texts {
      		e := embed(text, m, C.I64, "input_ids", []int64{1, m.MaxTextLength}, ids[i], "text_embeds")
      		texts = append(texts, accept(fmt.Sprintf("text %q", t.Prompt), e, t.Embeds))
      	}

      	vision := request(core, filepath.Join(dir, "vision.xml"))
      	defer C.ov_infer_request_free(vision)
      	for _, im := range ref.Images {
      		e := embed(vision, m, C.F32, "pixel_values", []int64{1, 3, m.ImageSize, m.ImageSize},
      			pixels(m, im.A, im.B), "image_embeds")
      		accept(fmt.Sprintf("image (%d,%d)", im.A, im.B), e, im.Embeds)
      		for j, t := range texts {
      			p := 1 / (1 + math.Exp(-(m.LogitScale*cosine(e, t) + m.LogitBias)))
      			fmt.Printf("  zero-shot %q: %.4f\n", ref.Texts[j].Prompt, p)
      		}
      	}
      	fmt.Printf("ok: %s weights, worst cosine %.6f\n", m.Weights, worst)
      }
      GOEOF
      test -z "$(gofmt -l .)"
      go vet .
      go build -o siglip-smoke .
      ./siglip-smoke "${{inputs.model-dir}}"
      rm -rf "$work"
