# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/melange/refs/heads/main/pkg/config/schema.json
package:
  name: libclc
  # Tracks the Wolfi llvm-23 stream, matching spirv-llvm-translator and mesa-full.
  # datasource: wolfi-base packageName: llvm-23
  version: "23.1.6"
  epoch: 0
  description: OpenCL C library implementation for the LLVM toolchain (LLVM 23)
  copyright:
    - license: Apache-2.0 WITH LLVM-exception
  target-architecture:
    - x86_64
environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-23
      - cmake
      - llvm-23-dev
      - python-3.13
      - samurai
      - spirv-llvm-translator
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{package.version}}/llvm-project-${{package.version}}.src.tar.xz
      expected-sha256: d3b86ab29cfb4445a6652e5c2642ccc75e04e38084dde3701d323320f35a31da
  - runs: |
      set -eu
      # Since LLVM 23 libclc builds one target per configure, taken from
      # LLVM_DEFAULT_TARGET_TRIPLE, and installs clc/<triple>/libclc.spv. mesa
      # loads spirv{32,64}-unknown-unknown/libclc.spv from libclc.pc's libexecdir.
      for triple in spirv32-unknown-unknown spirv64-unknown-unknown; do
        cmake -B "build-$triple" -G Ninja -S libclc \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_CLC_COMPILER=/usr/lib/llvm-23/bin/clang \
          -DLLVM_DEFAULT_TARGET_TRIPLE="$triple" \
          -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm \
          -DLLVM_SPIRV=/usr/bin/llvm-spirv
        cmake --build "build-$triple"
        DESTDIR="${{targets.destdir}}" cmake --install "build-$triple"
      done
      # libclc 23 no longer installs libclc.pc; mesa finds libclc through it.
      mkdir -p "${{targets.destdir}}"/usr/share/pkgconfig
      cat > "${{targets.destdir}}"/usr/share/pkgconfig/libclc.pc <<EOF
      libexecdir=/usr/share/clc

      Name: libclc
      Description: Library requirements of the OpenCL C programming language
      Version: ${{package.version}}
      Libs: -L\${libexecdir}
      EOF
test:
  pipeline:
    - uses: test/pkgconf
    - name: pkgconf resolves libclc and SPIR-V libraries are present
      runs: |
        set -eu
        pkgconf --exists libclc
        pkgconf --modversion libclc
        test -s /usr/share/clc/spirv32-unknown-unknown/libclc.spv
        test -s /usr/share/clc/spirv64-unknown-unknown/libclc.spv
        [ "$(pkgconf --variable=libexecdir libclc)" = /usr/share/clc ]
update:
  enabled: true
  release-monitor:
    identifier: 376264
    version-filter-prefix: "23."
