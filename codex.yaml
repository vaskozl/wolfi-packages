# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/melange/refs/heads/main/pkg/config/schema.json
# datasource: github-releases
# repository: https://github.com/openai/codex
package:
  name: codex
  version: "0.153.4"
  epoch: 1
  description: OpenAI Codex, an agentic coding tool for the terminal
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - coreutils
      - git
      - openssh-client
environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
pipeline:
  - runs: |
      set -eu

      case "${{build.arch}}" in
        x86_64) target="x86_64-unknown-linux-musl" ;;
        aarch64) target="aarch64-unknown-linux-musl" ;;
        *) echo "unsupported arch: ${{build.arch}}"; exit 1 ;;
      esac

      base="https://github.com/openai/codex/releases/download/rust-v${{package.version}}"

      curl -sfL -o codex.tar.gz \
        "$base/codex-${target}.tar.gz"

      curl -sfL -o codex-code-mode-host.tar.gz \
        "$base/codex-code-mode-host-${target}.tar.gz"

      tar -xzf codex.tar.gz
      tar -xzf codex-code-mode-host.tar.gz

      install -Dm0755 \
        "codex-${target}" \
        "${{targets.destdir}}/usr/bin/codex"

      install -Dm0755 \
        "codex-code-mode-host-${target}" \
        "${{targets.destdir}}/usr/bin/codex-code-mode-host"
test:
  pipeline:
    - uses: test/ldd-check
      with:
        packages: ${{package.name}}
    - uses: test/ver-check
      with:
        bins: |
          codex
    - uses: test/help-check
      with:
        bins: |
          codex
    - name: verify code-mode host
      runs: |
        test -x /usr/bin/codex-code-mode-host
update:
  enabled: true
  github:
    identifier: openai/codex
    strip-prefix: rust-v
