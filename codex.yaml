# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/melange/refs/heads/main/pkg/config/schema.json
# Tracks openai/codex GitHub Releases; Linux release archives are statically
# linked musl binaries.
# datasource: github-releases
# repository: https://github.com/openai/codex
package:
  name: codex
  version: "0.153.1"
  epoch: 0
  description: OpenAI Codex, an agentic coding tool for the terminal
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - coreutils
      - git
      - openssh-client
environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
pipeline:
  - runs: |
      set -eu
      case "${{build.arch}}" in
        x86_64) asset="codex-x86_64-unknown-linux-musl.tar.gz" ;;
        aarch64) asset="codex-aarch64-unknown-linux-musl.tar.gz" ;;
        *) echo "unsupported arch: ${{build.arch}}"; exit 1 ;;
      esac
      curl -sfL -o codex.tar.gz "https://github.com/openai/codex/releases/download/rust-v${{package.version}}/$asset"
      tar -xzf codex.tar.gz
      install -Dm0755 "${asset%.tar.gz}" "${{targets.destdir}}/usr/bin/codex"
test:
  pipeline:
    - uses: test/ldd-check
      with:
        packages: ${{package.name}}
    - uses: test/ver-check
      with:
        bins: |
          codex
    - uses: test/help-check
      with:
        bins: |
          codex
    - name: generate shell completion
      runs: |
        set -eu
        codex completion bash >/dev/null
update:
  enabled: true
  github:
    identifier: openai/codex
    strip-prefix: rust-v
