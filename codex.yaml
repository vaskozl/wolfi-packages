# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/melange/refs/heads/main/pkg/config/schema.json
# datasource: github-releases
# repository: https://github.com/openai/codex
package:
  name: codex
  version: "0.157.0"
  epoch: 1 # ship full codex-package layout
  description: OpenAI Codex, an agentic coding tool for the terminal
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - coreutils
      - git
      - openssh-client
      - procps
environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
pipeline:
  - runs: |
      set -eu

      case "${{build.arch}}" in
        x86_64) target="x86_64-unknown-linux-musl" ;;
        aarch64) target="aarch64-unknown-linux-musl" ;;
        *) echo "unsupported arch: ${{build.arch}}"; exit 1 ;;
      esac

      curl -sfL -o codex-package.tar.gz \
        "https://github.com/openai/codex/releases/download/rust-v${{package.version}}/codex-package-${target}.tar.gz"

      mkdir -p "${{targets.destdir}}/usr/lib/codex" "${{targets.destdir}}/usr/bin"
      tar -xzf codex-package.tar.gz -C "${{targets.destdir}}/usr/lib/codex"
      ln -s ../lib/codex/bin/codex "${{targets.destdir}}/usr/bin/codex"
test:
  pipeline:
    - uses: test/ldd-check
      with:
        packages: ${{package.name}}
    - uses: test/ver-check
      with:
        bins: |
          codex
    - uses: test/help-check
      with:
        bins: |
          codex
    - name: app-server daemon starts from the packaged layout
      runs: |
        set -eu
        export CODEX_HOME="$(mktemp -d)"
        codex app-server daemon start
        codex app-server daemon version
        codex app-server daemon stop
update:
  enabled: true
  github:
    identifier: openai/codex
    strip-prefix: rust-v
