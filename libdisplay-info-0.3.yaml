# niri's libdisplay-info-sys crate requires < 0.4 (0.4 changed the ABI).
package:
  name: libdisplay-info-0.3
  version: "0.3.0"
  epoch: 0
  description: EDID and DisplayID library
  copyright:
    - license: MIT
environment:
  contents:
    packages:
      - build-base
      - hwdata-dev
      - hwdata-pnp
      - meson
      - python3
pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/emersion/libdisplay-info
      tag: ${{package.version}}
  - uses: meson/configure
  - uses: meson/compile
  - uses: meson/install
  - uses: strip
subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    description: ${{package.name}} headers and pkg-config files
    test:
      environment:
        contents:
          packages:
            - pkgconf
      pipeline:
        - runs: |
            set -eu
            pkgconf --libs --cflags 'libdisplay-info >= 0.3.0' 'libdisplay-info < 0.4.0'
test:
  pipeline:
    - uses: test/ldd-check
      with:
        packages: ${{package.name}}
update:
  enabled: true
  git:
    tag-filter-prefix: "0.3."
