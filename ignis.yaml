package:
  name: ignis
  version: "0.9.0"
  epoch: 1
  description: Run Obsidian in a browser, served by a self-hosted Node server
  copyright:
    - license: AGPL-3.0-or-later
    - license: LicenseRef-Obsidian
  dependencies:
    runtime:
      - nodejs-${{vars.node-version}}
vars:
  node-version: 22
environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - git
      - nodejs-${{vars.node-version}}
      - npm
pipeline:
  # Upstream tags are v<version>+obsidian.<pin>; follow whatever Obsidian
  # release the tag pins (IGNIS_OBSIDIAN_PIN in its Dockerfile).
  # repository: https://github.com/Nystik-gh/ignis
  - name: Checkout
    runs: |
      set -eu
      repo=https://github.com/Nystik-gh/ignis
      tag=$(git ls-remote --tags --refs "$repo" "refs/tags/v${{package.version}}+*" | sed 's|.*refs/tags/||')
      [ "$(echo "$tag" | wc -w)" = 1 ] || { echo "want one tag for v${{package.version}}, got: $tag" >&2; exit 1; }
      git init -q
      git fetch -q --depth 1 "$repo" "refs/tags/$tag"
      git checkout -q FETCH_HEAD
      node_major=$(cut -d. -f1 .nvmrc)
      [ "$node_major" = "${{vars.node-version}}" ] || { echo "ignis wants node $(cat .nvmrc), vars.node-version is ${{vars.node-version}}" >&2; exit 1; }
  - uses: patch
    with:
      patches: shareable-file-url.patch
  - name: Fetch Obsidian
    runs: |
      set -eu
      v=$(sed -n 's/^ENV IGNIS_OBSIDIAN_PIN=//p' apps/ignis-server/Dockerfile)
      [ -n "$v" ] || { echo "no IGNIS_OBSIDIAN_PIN in Dockerfile" >&2; exit 1; }
      curl -fsSL "https://github.com/obsidianmd/obsidian-releases/releases/download/v$v/obsidian-$v.asar.gz" | gunzip > obsidian.asar
      npx --yes @electron/asar@4.3.1 extract obsidian.asar obsidian-app
      rm obsidian.asar
      got=$(node -p 'require("./obsidian-app/package.json").version')
      [ "$got" = "$v" ] || { echo "obsidian asar is $got, ignis pins $v" >&2; exit 1; }
  - name: Build
    runs: |
      set -eu
      # The Astro docs site is a workspace too; dropping it keeps its native deps out of node_modules.
      rm -rf apps/docs
      npm ci
      IGNIS_BUILD=r${{package.epoch}} npm run build
      npm prune --omit=dev
      # Native addons for the Bare runtime (tar-stream's imports.fs.bare); Node never loads them.
      rm -rf node_modules/bare-*/prebuilds
      find node_modules -type d -empty -delete
  - name: Install
    runs: |
      set -eu
      root=${{targets.destdir}}/usr/lib/ignis
      mkdir -p "$root"/apps/ignis-server "$root"/packages
      cp package.json "$root"/
      cp -a node_modules images obsidian-app "$root"/
      for p in packages/*/; do
        mkdir -p "$root/$p"
        cp "$p"package.json "$root/$p"
      done
      cp -a packages/server-core/src "$root"/packages/server-core/
      mkdir -p "$root"/packages/shim/dist "$root"/packages/ui/dist
      cp packages/shim/dist/shim-loader.js "$root"/packages/shim/dist/
      cp packages/ui/dist/ignis-ui.js "$root"/packages/ui/dist/
      cp apps/ignis-server/package.json "$root"/apps/ignis-server/
      cp -a apps/ignis-server/server "$root"/apps/ignis-server/
      find "$root"/apps/ignis-server/server -name '*.test.mjs' -delete
      mkdir -p ${{targets.destdir}}/usr/bin
      cat > ${{targets.destdir}}/usr/bin/ignis <<'EOF'
      #!/bin/sh
      : "${OBSIDIAN_ASSETS_PATH:=/usr/lib/ignis/obsidian-app}"
      : "${VAULT_ROOT:=/var/lib/ignis/vaults}"
      : "${DATA_ROOT:=/var/lib/ignis/data}"
      export OBSIDIAN_ASSETS_PATH VAULT_ROOT DATA_ROOT
      exec node /usr/lib/ignis/apps/ignis-server/server/index.js "$@"
      EOF
      chmod 755 ${{targets.destdir}}/usr/bin/ignis
test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /tmp/ignis-test
        start: env VAULT_ROOT=/tmp/ignis-test/vaults DATA_ROOT=/tmp/ignis-test/data AUTO_CREATE_DEFAULT=true PORT=38791 ignis
        expected_output: Server running
        post: |
          set -eu
          base=http://127.0.0.1:38791
          curl -sf "$base/" | grep -F shim-loader
          curl -sf -o /dev/null "$base/app.js"
          curl -sf "$base/api/vault/list" | grep -F '"My Vault"'
update:
  enabled: true
  github:
    identifier: Nystik-gh/ignis
    strip-prefix: v
