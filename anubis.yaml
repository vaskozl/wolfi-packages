# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/melange/refs/heads/main/pkg/config/schema.json
# Generated from https://raw.githubusercontent.com/alpinelinux/aports/refs/heads/master/testing/anubis/APKBUILD
# datasource: github-releases
# repository: https://github.com/TecharoHQ/anubis
package:
  name: anubis
  version: "1.28.0"
  epoch: 0 # use test/ver-check
  description: Block AI scrapers using a sha256 proof-of-work challenge
  copyright:
    - license: MIT
environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - go-1.26
pipeline:
  # The vendor-npm release tarball ships the prebuilt web assets and wasm
  # modules; building those from git needs a rust wasm32 toolchain.
  - runs: |
      set -eu
      curl -sfL "https://github.com/TecharoHQ/anubis/releases/download/v${{package.version}}/anubis-src-vendor-npm-${{package.version}}.tar.gz" |
        tar -xz --strip-components=1
  - uses: go/build
    with:
      go-package: go-1.26
      ldflags: -X github.com/TecharoHQ/anubis.Version=${{package.version}}
      packages: ./cmd/anubis
      output: anubis
      tags: limitedsupportability
test:
  pipeline:
    - uses: test/ver-check
      with:
        bins: |
          anubis
update:
  enabled: true
  github:
    identifier: TecharoHQ/anubis
    strip-prefix: v
