# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/melange/refs/heads/main/pkg/config/schema.json
package:
  name: flate
  version: 0.6.5
  epoch: 0
  description: A Flux resource validator and inflator
  copyright:
    - license: AGPL-3.0-only
environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/home-operations/flate
      tag: v${{package.version}}
  - uses: go/build
    with:
      go-package: go-1.27
      packages: ./cmd/flate
      output: flate
      ldflags: -s -w -X main.version=${{package.version}}
  - uses: strip
test:
  pipeline:
    - uses: test/ver-check
      with:
        bins: |
          flate
    - uses: test/help-check
      with:
        bins: |
          flate
    - name: Render and validate a Flux Kustomization
      runs: |
        set -eu
        fixture=$(mktemp -d)
        mkdir -p "$fixture/app"
        cat > "$fixture/ks.yaml" <<'EOF'
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: test
          namespace: flux-system
        spec:
          interval: 5m
          path: ./app
          prune: true
          sourceRef:
            kind: GitRepository
            name: flux-system
        EOF
        cat > "$fixture/app/kustomization.yaml" <<'EOF'
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        resources:
          - configmap.yaml
        EOF
        cat > "$fixture/app/configmap.yaml" <<'EOF'
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: flate-test
          namespace: default
        data:
          message: hello
        EOF
        flate test all --path "$fixture" --no-progress
        flate build ks --path "$fixture" --no-progress > "$fixture/rendered.yaml"
        grep -F 'name: flate-test' "$fixture/rendered.yaml"
        grep -F 'message: hello' "$fixture/rendered.yaml"
update:
  enabled: true
  github:
    identifier: home-operations/flate
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
