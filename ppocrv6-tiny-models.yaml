# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/melange/refs/heads/main/pkg/config/schema.json
# PP-OCRv6 tiny models in ONNX form, as RapidOCR publishes them on ModelScope.
# Version is the RapidOCR model repo revision. Not tracked by renovate on purpose:
# rekon's veroso pins these exact models, so a bump is a deliberate change.
package:
  name: ppocrv6-tiny-models
  version: "3.9.2"
  epoch: 0
  description: PP-OCRv6 tiny text detector and multilingual recogniser (ONNX)
  copyright:
    - license: Apache-2.0
environment:
  contents:
    packages:
      - busybox
pipeline:
  - uses: fetch
    with:
      uri: https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v${{package.version}}/onnx/PP-OCRv6/det/PP-OCRv6_det_tiny.onnx
      expected-sha256: f42c0fbd294d95eac1a550e131b277dac97462c8025fa4b6c3cec1b7894bd3d5
      extract: false
  - uses: fetch
    with:
      uri: https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v${{package.version}}/onnx/PP-OCRv6/rec/PP-OCRv6_rec_tiny.onnx
      expected-sha256: e16e242de5937ad92609223f19bc2aff3727ee40b095f996907c24749bad251b
      extract: false
  - runs: |
      set -eu
      install -d "${{targets.destdir}}/usr/share/ppocr"
      install -m644 PP-OCRv6_det_tiny.onnx "${{targets.destdir}}/usr/share/ppocr/det.onnx"
      install -m644 PP-OCRv6_rec_tiny.onnx "${{targets.destdir}}/usr/share/ppocr/rec.onnx"
test:
  environment:
    contents:
      packages:
        - build-base
        - onnxruntime-dev
        - pkgconf
  pipeline:
    - name: ONNX Runtime loads both models and finds the recogniser's character list
      runs: |
        set -eu
        cd "$(mktemp -d)"
        cat > t.c <<'EOF'
        #include <stdio.h>
        #include <stdlib.h>
        #include <onnxruntime_c_api.h>

        static const OrtApi *api;

        static void check(OrtStatus *st) {
          if (st) { fprintf(stderr, "%s\n", api->GetErrorMessage(st)); exit(1); }
        }

        int main(void) {
          api = OrtGetApiBase()->GetApi(ORT_API_VERSION);
          OrtEnv *env;
          OrtSessionOptions *opts;
          OrtSession *det, *rec;
          OrtModelMetadata *md;
          OrtAllocator *alloc;
          char *chars = NULL;
          check(api->CreateEnv(ORT_LOGGING_LEVEL_WARNING, "test", &env));
          check(api->CreateSessionOptions(&opts));
          check(api->CreateSession(env, "/usr/share/ppocr/det.onnx", opts, &det));
          check(api->CreateSession(env, "/usr/share/ppocr/rec.onnx", opts, &rec));
          check(api->GetAllocatorWithDefaultOptions(&alloc));
          check(api->SessionGetModelMetadata(rec, &md));
          check(api->ModelMetadataLookupCustomMetadataMap(md, alloc, "character", &chars));
          if (!chars || !*chars) { fprintf(stderr, "rec.onnx: no character list\n"); return 1; }
          return 0;
        }
        EOF
        cc $(pkg-config --cflags libonnxruntime) -o t t.c $(pkg-config --libs libonnxruntime)
        ./t
