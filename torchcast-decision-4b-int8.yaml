# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/melange/refs/heads/main/pkg/config/schema.json
# torchcast-decision-4b decide model (Qwen3.5-4B finetune), exported at build time to an
# OpenVINO graph and vision encoder by decide-export. The weights are pinned by HF commit
# (vars.revision, tag v1.3.1), so there is no renovate tracking and no bump bot; that is
# also why the fetch URIs interpolate ${{vars.revision}}. Re-exporting the same weights bumps epoch.
# int8 only: bf16 weights expand to f32 on CPUs without bf16, about 26 GiB for this model,
# so the bf16 export is a build intermediate that is never checked or packaged.
package:
  name: torchcast-decision-4b-int8
  version: "1.3.1"
  epoch: 0
  description: torchcast-decision-4b decide model (4B) as an OpenVINO graph and vision encoder, int8 weights
  copyright:
    - license: Apache-2.0
  # The content is arch-independent, but melange has no noarch and the openvino
  # runtime exists only on x86_64.
  target-architecture:
    - x86_64
  resources:
    cpu: "4"
    memory: 16Gi
  dependencies:
    provides:
      # Unversioned so models co-install; consumers depend on it and pick a model.
      - decide-model-format-2
    runtime:
      - openvino-tokenizers
      - openvino~2026.4
vars:
  revision: 684d2b19a5c493996847e1a434bf4b4b058a948c
environment:
  contents:
    packages:
      - busybox
      - decide-export
  environment:
    # wget's default dot progress for multi-GB weights overflows the 4 MiB CI job log.
    WGETRC: /home/build/.wgetrc
pipeline:
  - runs: echo 'progress = dot:giga' > /home/build/.wgetrc
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/model-00001-of-00003.safetensors
      expected-sha256: 13d6c12effda844c0da68b83e3e962f326fca2fb9443ea4c1447070171fe15ce
      extract: false
      timeout: 600
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/model-00002-of-00003.safetensors
      expected-sha256: 2a4fc379d3a38688df68e1af6d0c179c71d60e8047757100592585689e4abb5b
      extract: false
      timeout: 600
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/model-00003-of-00003.safetensors
      expected-sha256: 9132529e66cac3079a828b70ff720888e735b62dcc8a839f7c42730ef896d42c
      extract: false
      timeout: 300
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/tokenizer.json
      expected-sha256: 5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/tokenizer_config.json
      expected-sha256: 316230d6a809701f4db5ea8f8fc862bc3a6f3229c937c174e674ff3ca0a64ac8
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/chat_template.jinja
      expected-sha256: a4aee8afcf2e0711942cf848899be66016f8d14a889ff9ede07bca099c28f715
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/config.json
      expected-sha256: c1166cebf4601a70e49380d4fed99aa0909df25c9ea1eafce5fa00575c7a3703
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/generation_config.json
      expected-sha256: 0b725bef7b591339bc06389199c47d8e91bd7cef83c47bca3b747aefd3be489e
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/preprocessor_config.json
      expected-sha256: 27225450ac9c6529872ee1924fcb0962ff5634834f817040f444118116f4e516
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/decision_config.json
      expected-sha256: 58b904ef2ee33fa8885d9bcfa8806bcc392ff392c9b10742ffc3bc26c379a460
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/README.md
      expected-sha256: b82677a808b8aef2dd7f1650be37348cf605523013cd1415cc5e8e7ef945ad6c
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/LICENSE
      expected-sha256: c95bae1d1ce0235ecccd3560b772ec1efb97f348a79f0fbe0a634f0c2ccefe2c
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/LICENSE-qwen-Apache-2.0
      expected-sha256: 50cbab8a892c5f2993b8c7351a99182507472def3b1374558308605d99b86b32
      extract: false
      timeout: 120
  - uses: fetch
    with:
      uri: https://huggingface.co/torchcast-ai/torchcast-decision-4b/resolve/${{vars.revision}}/NOTICE
      expected-sha256: 7736e637341dd1a5edd5d90302e658acd43477de6d23577527023e6cfaafce5e
      extract: false
      timeout: 120
  - runs: |
      set -eu
      # One heavy process at a time, and the disk peak kept to the shards plus the bf16 IR.
      decide-export export --src . --out bf16 --reference check-reference.json --no-check
      rm model-*.safetensors
      decide-export compress --model bf16 --out "${{targets.destdir}}/usr/share/decide/models/${{package.name}}" \
        --reference check-reference.json --no-bf16-check
      rm -r bf16
      lic="${{targets.destdir}}/usr/share/licenses/${{package.name}}"
      install -Dm644 README.md "$lic/MODEL_CARD.md"
      install -Dm644 LICENSE "$lic/LICENSE"
      install -Dm644 LICENSE-qwen-Apache-2.0 "$lic/LICENSE-qwen-Apache-2.0"
      install -Dm644 NOTICE "$lic/NOTICE"
test:
  environment:
    contents:
      packages:
        - build-base
        - go-1.27
        - openvino-dev
        - pkgconf
  pipeline:
    - name: model directory holds the int8 IR, the tokenizer IR and the HF metadata
      runs: |
        set -eu
        cd "/usr/share/decide/models/${{package.name}}"
        for f in fork.xml fork.bin vision.xml vision.bin openvino_tokenizer.xml openvino_tokenizer.bin decide.json \
          config.json tokenizer.json tokenizer_config.json chat_template.jinja generation_config.json \
          preprocessor_config.json decision_config.json; do
          test -s "$f"
        done
        grep -qF '"weights": "int8"' decide.json
        grep -qF '"attention": "bidirectional"' decide.json
        for f in MODEL_CARD.md LICENSE LICENSE-qwen-Apache-2.0 NOTICE; do
          test -s "/usr/share/licenses/${{package.name}}/$f"
        done
    - uses: test/decide-model
      with:
        model-dir: /usr/share/decide/models/${{package.name}}
